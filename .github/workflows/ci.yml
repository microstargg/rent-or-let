name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

jobs:
  lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Build
        run: npm run build
        env:
          NEON_AUTH_BASE_URL: https://example.neonauth.test/neondb/auth
          NEON_AUTH_COOKIE_SECRET: ci-cookie-secret-at-least-32-characters-long
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000

  e2e-public:
    runs-on: ubuntu-latest
    needs: lint-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - name: Playwright public + access-control smoke
        run: npm run test:e2e:public
        env:
          CI: "true"
          NEON_AUTH_BASE_URL: https://example.neonauth.test/neondb/auth
          NEON_AUTH_COOKIE_SECRET: ci-cookie-secret-at-least-32-characters-long
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100

  phase-gates:
    runs-on: ubuntu-latest
    needs: lint-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Domain phase gates A–F
        run: npm run test:phase
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
