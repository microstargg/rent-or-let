name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint platform
        run: npm run lint -w @repo/web

      - name: Build platform
        env:
          AGENCY_SLUG: pms
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          NEON_AUTH_BASE_URL: https://example.com/auth
          NEON_AUTH_COOKIE_SECRET: ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci
        run: npm run build -w @repo/web

      - name: Build public site
        env:
          AGENCY_SLUG: pms
        run: npm run build -w @repo/site
