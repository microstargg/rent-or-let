name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        tenant_id: [pms, veri-properties]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -w @repo/web

      - name: Build
        env:
          TENANT_ID: ${{ matrix.tenant_id }}
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          NEON_AUTH_BASE_URL: https://example.com/auth
          NEON_AUTH_COOKIE_SECRET: ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci
          NEXT_PUBLIC_SITE_URL: https://example.com
        run: npm run build -w @repo/web
